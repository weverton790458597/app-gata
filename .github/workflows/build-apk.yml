name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Instalar Capacitor e dependências
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "App Gata" "com.appgata.app" --web-dir=www
        npx cap add android
        npx cap sync android

    - name: Corrigir conflitos de dependência do Kotlin
      run: |
        # Adiciona resolução de conflitos no arquivo build.gradle do app se necessário
        echo "
        configurations.all {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '1.8.22'
                }
            }
        }" >> android/app/build.gradle

    - name: Compilar APK com Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Salvar APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: app-gata-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
